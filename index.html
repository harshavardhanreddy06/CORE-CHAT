<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CORE CHAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
  <script src="image-upload.js" type="module"></script>
  <script src="pdf-upload.js" type="module"></script>
  <script src="renderer.js" type="module"></script>
</head>
<body>


  <!-- Main chat area -->
  <div id="main-content">
    <div id="chat-container">
      <!-- Messages appear here -->
    </div>

    <!-- Input bar -->
    <div id="input-area">
      <div id="input-bar">
        <!-- Attachment chips row (shown when files are attached) -->
        <div id="attachment-preview"></div>

        <textarea id="input" placeholder="Send a message" rows="1"></textarea>
        <div id="input-bar-actions">
          <button id="add-file" class="bar-icon-btn" title="Attach image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>
          <button id="add-pdf" class="bar-icon-btn" title="Attach PDF">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
          </button>
          <button id="new-chat-btn" title="Start a new session">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            New Session
          </button>
          <span id="turn-counter" title="Exchanges in memory"></span>
          <div id="model-select-container">
            <select id="model-select" title="Select Ollama model">
              <option value="" disabled selected>Loading…</option>
            </select>
            <svg class="chevron-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
            <button id="refresh-models" title="Refresh model list">↻</button>
          </div>
          <button id="send" title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Templates (hidden) -->
  <template id="user-message-template">
    <div class="message user-message"></div>
  </template>

  <template id="assistant-message-template">
    <div class="message assistant-message"></div>
  </template>

  <template id="error-message-template">
    <div class="message error-message"></div>
  </template>

</body>
</html>
